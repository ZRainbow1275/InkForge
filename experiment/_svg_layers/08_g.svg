<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" style="display: block; width: 100%; visibility: visible;" role="img" aria-label="插图"><g font-family="Monaco,Menlo,'Courier New',monospace" text-anchor="middle" style="visibility: visible;"><text x="375" y="120" fill="#7ee787" font-size="24" style="visibility: visible;"><tspan leaf="" style="visibility: visible;"># Alan Turing</tspan></text><text x="375" y="195" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">╔════════════╗</tspan></text><text x="375" y="232" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ ╭────────╮ ║</tspan></text><text x="375" y="269" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ │ ● &nbsp; &nbsp;● │ ║</tspan></text><text x="375" y="306" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ │ &nbsp; ▽ &nbsp; &nbsp;│ ║</tspan></text><text x="375" y="343" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ │ &nbsp;─── &nbsp; │ ║</tspan></text><text x="375" y="380" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ ╰────────╯ ║</tspan></text><text x="375" y="417" fill="#e8d5a8" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">║ 1912—1954 &nbsp;║</tspan></text><text x="375" y="454" fill="#c9d1d9" font-size="30" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">╚════════════╝</tspan></text><text x="375" y="520" fill="#FF8B2C" font-size="26" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">echo "Can Machines Think?"</tspan></text><text x="375" y="560" fill="#c9d1d9" font-size="28" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">Can Machines Think?</tspan></text><text x="375" y="610" fill="#7ee787" font-size="22" style="visibility: visible;"><tspan leaf="" style="visibility: visible;"># 七十年后 我们还在回答</tspan></text><text x="375" y="730" fill="#5a5040" font-size="28" style="visibility: visible;"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"></animate><tspan leaf="" style="visibility: visible;">点 击 敬 香</tspan></text><text x="375" y="775" fill="#3a3020" font-size="22" style="visibility: visible;"><tspan leaf="" style="visibility: visible;">(´-ω-`) &nbsp;敬</tspan></text><text x="375" y="960" fill="#21262d" font-size="16"><tspan leaf="">清明 · 赛博禅心</tspan></text></g></svg>