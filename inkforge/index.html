<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://*.siliconflow.cn https://*.openai.com https://*.anthropic.com https://*.deepseek.com; font-src 'self' data: https://fonts.gstatic.com;">
    <title>InkForge - 墨铸编辑器</title>
    <style>
      /* InkForge loading placeholder — CSS-only, 0 JS dependency.
         Visible from first paint until Vue replaces #app's children on app.mount('#app').
         Brand spec: docs/inkforge-brand-identity.md §11 Loading Placeholder. */
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #F7F4EF; /* Paper */
        color: #1C1F23;      /* Ink Black */
        font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','SimSun','EB Garamond',serif;
        -webkit-font-smoothing: antialiased;
      }
      .ink-app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #F7F4EF;
        color: #1C1F23;
        text-align: center;
        z-index: 0;
      }
      .ink-app-shell__seal {
        width: 140px;
        height: 140px;
        filter: drop-shadow(0 6px 14px rgba(28, 31, 35, 0.16));
      }
      .ink-app-shell__wordmark {
        display: flex;
        align-items: baseline;
        gap: 0.45em;
        font-family: 'EB Garamond','Source Han Serif SC','Noto Serif SC',serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #1F1F1F;
      }
      .ink-app-shell__wordmark-name { font-family: 'EB Garamond','Crimson Pro',Georgia,serif; }
      .ink-app-shell__wordmark-dot  { color: #C9362C; opacity: 0.85; font-weight: 400; }
      .ink-app-shell__wordmark-cn   {
        font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong',serif;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .ink-app-shell__tagline {
        font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong',serif;
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.25em;
        color: #9B958D;
      }
      .ink-app-shell__caption {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: #9B958D; /* Smoke */
        margin-top: 8px;
        animation: ink-app-shell-pulse 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes ink-app-shell-pulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        body, .ink-app-shell { background: #1A1D24; color: #E8E4DC; } /* Char + light text */
        .ink-app-shell__wordmark    { color: #E8E4DC; }
        .ink-app-shell__wordmark-dot { color: #E15A4E; } /* Forged Red lifted for dark */
        .ink-app-shell__tagline     { color: #6E7580; }
        .ink-app-shell__caption     { color: #6E7580; }
        .ink-app-shell__seal        { filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ink-app-shell__caption { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ink-app-shell" role="status" aria-live="polite" aria-label="InkForge 启动中">
        <!-- 墨滴 · 笔锋 · 铁砧 mark (mirrors src-tauri/icons/master-1024.svg geometry; 0 font dependency)
             A Forged-Red ember (灵感) at the top, a black ink-drop (墨) sliced by
             a paper-colored diagonal gap, a black nib-arrow stroke (创作/发送) that
             shoots up-right, and a black forging-anvil (铸/Forge) base. The mark
             sits on a transparent background — no panel/card sheen behind it.
             Palette: Ink Black #1C1F23, Forged Red #C9362C, Paper #F7F4EF.
             Latin / 简体 wordmark + tagline are composed in HTML below using the app font stack. -->
        <svg class="ink-app-shell__seal" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bootDropSheen" x1="0" y1="0" x2="0.55" y2="1">
              <stop offset="0%" stop-color="#2B2F35"/>
              <stop offset="48%" stop-color="#1C1F23"/>
              <stop offset="100%" stop-color="#141619"/>
            </linearGradient>
            <radialGradient id="bootEmberGlow" cx="42%" cy="38%" r="62%">
              <stop offset="0%" stop-color="#E66054" stop-opacity="0.55"/>
              <stop offset="55%" stop-color="#C9362C" stop-opacity="0"/>
              <stop offset="100%" stop-color="#C9362C" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="bootAnvilShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#1C1F23" stop-opacity="0.22"/>
              <stop offset="70%" stop-color="#1C1F23" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="#1C1F23" stop-opacity="0"/>
            </radialGradient>
            <mask id="bootDropSlice">
              <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
              <path d="M 352 612 L 690 415 L 726 477 L 388 674 Z" fill="#000000"/>
            </mask>
          </defs>
          <ellipse cx="512" cy="872" rx="210" ry="30" fill="url(#bootAnvilShadow)"/>
          <circle cx="512" cy="178" r="54" fill="#C9362C"/>
          <circle cx="512" cy="178" r="54" fill="url(#bootEmberGlow)"/>
          <path
            d="M 512 286 C 556 360 624 430 624 506 C 624 568 574 614 512 614 C 450 614 400 568 400 506 C 400 430 468 360 512 286 Z"
            fill="url(#bootDropSheen)" mask="url(#bootDropSlice)"/>
          <path d="M 380 654 L 700 459 L 676 503 L 396 678 Z" fill="#1C1F23"/>
          <path d="M 786 292 L 618 360 L 668 388 L 700 374 L 690 432 L 720 480 L 786 292 Z" fill="#1C1F23"/>
          <path
            d="M 296 672 Q 290 671 294 682 L 312 722 Q 322 742 358 744 L 472 744 L 472 766 Q 446 772 440 800 Q 434 826 422 838 L 374 856 Q 352 864 352 874 L 672 874 Q 672 864 650 856 L 602 838 Q 590 826 584 800 Q 578 772 552 766 L 552 744 L 666 744 Q 702 742 712 722 L 730 682 Q 734 671 728 672 Q 700 700 636 700 L 388 700 Q 324 700 296 672 Z"
            fill="#1C1F23"/>
        </svg>
        <div class="ink-app-shell__wordmark">
          <span class="ink-app-shell__wordmark-name">InkForge</span>
          <span class="ink-app-shell__wordmark-dot">·</span>
          <span class="ink-app-shell__wordmark-cn">墨铸</span>
        </div>
        <div class="ink-app-shell__tagline">成为作者吧</div>
        <div class="ink-app-shell__caption">正在准备墨砚...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
