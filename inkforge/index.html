<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://*.siliconflow.cn https://*.openai.com https://*.anthropic.com https://*.deepseek.com; font-src 'self' data: https://fonts.gstatic.com;">
    <title>InkForge - 墨铸编辑器</title>
    <style>
      /* InkForge loading placeholder — CSS-only, 0 JS dependency.
         Visible from first paint until Vue replaces #app's children on app.mount('#app').
         Brand spec: docs/inkforge-brand-identity.md §11 Loading Placeholder. */
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #F5F0E6; /* Vellum */
        color: #252933;      /* Graphite */
        font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','SimSun','EB Garamond',serif;
        -webkit-font-smoothing: antialiased;
      }
      .ink-app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F5F0E6;
        color: #252933;
        text-align: center;
        z-index: 0;
      }
      .ink-app-shell__seal {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 6px 12px rgba(37, 41, 51, 0.18));
      }
      .ink-app-shell__wordmark {
        font-size: 14px;
        letter-spacing: 0.18em;
        color: #6E7580; /* Ash */
        font-weight: 600;
      }
      .ink-app-shell__caption {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #9B958D; /* Smoke */
        margin-top: 2px;
        animation: ink-app-shell-pulse 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes ink-app-shell-pulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        body, .ink-app-shell { background: #1A1D24; color: #E8E4DC; } /* Char + light text */
        .ink-app-shell__wordmark { color: #9B958D; }
        .ink-app-shell__caption  { color: #6E7580; }
        .ink-app-shell__seal     { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.55)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ink-app-shell__caption { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ink-app-shell" role="status" aria-live="polite" aria-label="InkForge 启动中">
        <!-- Forge Nib seal (mirrors src-tauri/icons/master.svg; 0 font dependency) -->
        <svg class="ink-app-shell__seal" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="226" y="226" width="572" height="572" rx="72" ry="72" fill="#D95B3F"/>
          <rect x="244" y="244" width="536" height="536" rx="58" ry="58" fill="none" stroke="#F5F0E6" stroke-opacity="0.18" stroke-width="2"/>
          <polygon points="512,312 680,512 512,712 344,512" fill="#252933"/>
          <rect x="506" y="380" width="12" height="260" rx="6" ry="6" fill="#F5F0E6"/>
          <rect x="412" y="748" width="200" height="10" rx="5" ry="5" fill="#C19A56"/>
        </svg>
        <div class="ink-app-shell__wordmark">InkForge · 墨铸</div>
        <div class="ink-app-shell__caption">正在准备墨砚...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
