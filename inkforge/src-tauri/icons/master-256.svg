  <title>InkForge 墨铸 — 墨滴 · 笔锋 · 铁砧 (256/512 raster)</title>
  <desc>Tier 4 — mirrors src/components/chrome/ForgeNibMark.vue tier 256 verbatim: full detail — a soft contact-shadow ellipse, a Forged-Red ember with a soft halo, a full sliced ink-drop with a soft top-left highlight, a full nib-arrow (shaft + arrowhead), and a forging-anvil base — the canonical 墨滴·笔锋·铁砧 logo with the nib-arrow restored. Palette: Ink Black #1C1F23, Forged Red #C9362C, ember-highlight #E66054, highlight grey #2B2F35, Paper #F7F4EF (slice gap). Transparent background. 0 font dependency.</desc>

  <defs>
