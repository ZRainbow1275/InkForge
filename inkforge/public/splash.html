<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InkForge · 墨铸</title>
  <style>
    /* ------------------------------------------------------------------
       InkForge splash — Brand identity §10
       Vellum #F5F0E6 background with subtle 仿宣纸 noise.
       Seal animation: drop (0→300ms) → squish (300→360ms) → bleed (360→800ms).
       data-theme="dark" on :root takes precedence over prefers-color-scheme.
       prefers-reduced-motion disables all animations; static identity remains.

       2026-05-29 swap: static mark identity inside the bleed sequence is now
       the 墨滴 · 笔锋 · 铁砧 mark (mirrors src-tauri/icons/master-1024.svg
       geometry) — Forged-Red ember + sliced ink-drop + nib-arrow + forging
       anvil. The prior 鼎 × 笔尖 × 方格 grid mark was retired (read muddy at
       small sizes). All drop/squish/bleed keyframe timings are PRESERVED
       unchanged.
    ------------------------------------------------------------------ */

    :root {
      /* Motion tokens mirrored from src/styles/tokens.css. Splash loads
         before Vue so it cannot import from there; values are kept in sync
         manually (Restrained Premium ladder, §13 of brand identity doc). */
      --motion-base: 180ms;
      --motion-slow: 240ms;
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);

      /* Logo-surface palette (Logo Concept 08): 墨滴 · 笔锋 · 铁砧 mark uses the
         new official tokens. The splash is a logo surface, so it adopts
         Paper/Ink-Black/Forged-Red. Drop/squish/bleed keyframe timings are
         UNCHANGED. */
      --ink-paper: #F7F4EF;
      --ink-char: #1A1D24;
      --ink-ink-black: #1C1F23;
      --ink-text-dark: #E8E4DC;
      --ink-ash: #6E7580;
      --ink-smoke: #9B958D;
      --ink-forged-red: #C9362C;
      --ink-forged-red-dark: #E15A4E;
      --ink-grey: #6B6F76;
      --ink-bg: var(--ink-paper);
      --ink-text: var(--ink-ink-black);
      --ink-muted: var(--ink-ash);
      --ink-seal: var(--ink-forged-red);
    }

    /* prefers-color-scheme dark — only if no explicit data-theme set */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink-bg: var(--ink-char);
        --ink-text: var(--ink-text-dark);
        --ink-muted: var(--ink-smoke);
        --ink-seal: var(--ink-forged-red-dark);
      }
    }
    /* Explicit data-theme from Rust setup hook wins */
    :root[data-theme="dark"] {
      --ink-bg: var(--ink-char);
      --ink-text: var(--ink-text-dark);
      --ink-muted: var(--ink-smoke);
      --ink-seal: var(--ink-forged-red-dark);
    }
    :root[data-theme="light"] {
      --ink-bg: var(--ink-paper);
      --ink-text: var(--ink-ink-black);
      --ink-muted: var(--ink-ash);
      --ink-seal: var(--ink-forged-red);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      color: var(--ink-text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    .ink-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--ink-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 仿宣纸纹理 — 极淡的多层径向渐变模拟纤维 */
    .ink-canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(193, 154, 86, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(59, 122, 107, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 41, 51, 0.02) 0%, transparent 70%);
      opacity: 0.9;
    }
    :root[data-theme="dark"] .ink-canvas::before,
    :root:not([data-theme="light"]) .ink-canvas::before {
      opacity: 0.5;
    }

    /* 印章本体 — 墨滴 · 笔锋 · 铁砧 mark, drop→squish→bleed animation envelope */
    .ink-seal {
      position: relative;
      width: 108px;
      height: 108px;
      flex-shrink: 0;
      animation: ink-seal-drop 360ms var(--ease-out-quart) both;
      transform-origin: 50% 100%;
    }
    .ink-seal svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 14px rgba(28, 31, 35, 0.16));
    }
    :root[data-theme="dark"] .ink-seal svg,
    :root:not([data-theme="light"]) .ink-seal svg {
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
    }

    /* 8-direction ink bleed — emanating from seal edges */
    .ink-bleed {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 108px;
      height: 108px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      animation: ink-bleed-fade 440ms cubic-bezier(0.4, 0, 0.6, 1) 360ms both;
    }
    .ink-bleed span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--ink-seal) 0%, rgba(201, 54, 44, 0) 70%);
      opacity: 0.35;
      transform-origin: 0 0;
    }
    /* 8 方向 — N / NE / E / SE / S / SW / W / NW */
    .ink-bleed span:nth-child(1) { transform: translate(-50%, -110px); }
    .ink-bleed span:nth-child(2) { transform: translate(60px, -78px); }
    .ink-bleed span:nth-child(3) { transform: translate(78px, -50%); }
    .ink-bleed span:nth-child(4) { transform: translate(60px, 42px); }
    .ink-bleed span:nth-child(5) { transform: translate(-50%, 74px); }
    .ink-bleed span:nth-child(6) { transform: translate(-78px, 42px); }
    .ink-bleed span:nth-child(7) { transform: translate(-96px, -50%); }
    .ink-bleed span:nth-child(8) { transform: translate(-78px, -78px); }

    .ink-wordmark {
      margin-top: 28px;
      text-align: center;
      animation: ink-wordmark-rise 500ms var(--ease-out-quart) 240ms both;
    }
    .ink-wordmark__latin {
      font-family: "EB Garamond", "Crimson Pro", Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-text);
    }
    .ink-wordmark__separator {
      display: inline-block;
      margin: 0 0.5em;
      color: var(--ink-seal);
      font-weight: 400;
      opacity: 0.78;
    }
    .ink-wordmark__cjk {
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ink-text);
    }
    .ink-tagline {
      margin-top: 12px;
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.25em;
      color: var(--ink-muted);
      animation: ink-tagline-fade 400ms cubic-bezier(0.4, 0, 0.6, 1) 480ms both;
    }

    /* ----- Animations ------------------------------------------------ */

    @keyframes ink-seal-drop {
      0% {
        opacity: 0;
        transform: translateY(-40px) scale(0.92);
      }
      80% {
        opacity: 1;
        transform: translateY(2px) scaleY(0.92) scaleX(1.04);
      }
      90% {
        transform: translateY(0) scaleY(1.02) scaleX(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ink-bleed-fade {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes ink-wordmark-rise {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes ink-tagline-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ----- Reduced motion ------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .ink-seal,
      .ink-bleed,
      .ink-wordmark,
      .ink-tagline {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .ink-bleed { display: none; }
    }
  </style>
</head>
<body>
  <div class="ink-canvas">
    <div class="ink-bleed" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="ink-seal" role="img" aria-label="InkForge 墨铸 印章">
      <!--
        墨滴 · 笔锋 · 铁砧 mark — mirrors src-tauri/icons/master-1024.svg geometry.
        A Forged-Red ember (灵感) at the top, a black ink-drop (墨) sliced by a
        paper-colored diagonal gap, a black nib-arrow stroke (创作/发送) shooting
        up-right, and a black forging-anvil (铸/Forge) base. The mark sits on a
        transparent background — no panel/card sheen behind it. Palette: Ink
        Black #1C1F23, Forged Red #C9362C, Paper #F7F4EF. Drop/squish/bleed
        keyframe timing is PRESERVED unchanged. 0 font dependency preserved.
      -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="splashDropSheen" x1="0" y1="0" x2="0.55" y2="1">
            <stop offset="0%" stop-color="#2B2F35"/>
            <stop offset="48%" stop-color="#1C1F23"/>
            <stop offset="100%" stop-color="#141619"/>
          </linearGradient>
          <radialGradient id="splashEmberGlow" cx="42%" cy="38%" r="62%">
            <stop offset="0%" stop-color="#E66054" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#C9362C" stop-opacity="0"/>
            <stop offset="100%" stop-color="#C9362C" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="splashAnvilShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1C1F23" stop-opacity="0.22"/>
            <stop offset="70%" stop-color="#1C1F23" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#1C1F23" stop-opacity="0"/>
          </radialGradient>
          <mask id="splashDropSlice">
            <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
            <path d="M 352 612 L 690 415 L 726 477 L 388 674 Z" fill="#000000"/>
          </mask>
        </defs>
        <ellipse cx="512" cy="872" rx="210" ry="30" fill="url(#splashAnvilShadow)"/>
        <circle cx="512" cy="178" r="54" fill="#C9362C"/>
        <circle cx="512" cy="178" r="54" fill="url(#splashEmberGlow)"/>
        <path
          d="M 512 286 C 556 360 624 430 624 506 C 624 568 574 614 512 614 C 450 614 400 568 400 506 C 400 430 468 360 512 286 Z"
          fill="url(#splashDropSheen)" mask="url(#splashDropSlice)"/>
        <path d="M 380 654 L 700 459 L 676 503 L 396 678 Z" fill="#1C1F23"/>
        <path d="M 786 292 L 618 360 L 668 388 L 700 374 L 690 432 L 720 480 L 786 292 Z" fill="#1C1F23"/>
        <path
          d="M 296 672 Q 290 671 294 682 L 312 722 Q 322 742 358 744 L 472 744 L 472 766 Q 446 772 440 800 Q 434 826 422 838 L 374 856 Q 352 864 352 874 L 672 874 Q 672 864 650 856 L 602 838 Q 590 826 584 800 Q 578 772 552 766 L 552 744 L 666 744 Q 702 742 712 722 L 730 682 Q 734 671 728 672 Q 700 700 636 700 L 388 700 Q 324 700 296 672 Z"
          fill="#1C1F23"/>
      </svg>
    </div>

    <div class="ink-wordmark">
      <span class="ink-wordmark__latin">InkForge</span>
      <span class="ink-wordmark__separator">·</span>
      <span class="ink-wordmark__cjk">墨铸</span>
    </div>
    <div class="ink-tagline">成为作者吧</div>
  </div>
</body>
</html>
