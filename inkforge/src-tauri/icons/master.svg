<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="InkForge 墨铸 — 锻铸笔尖 logo">
  <title>InkForge 墨铸 — Forge Nib</title>
  <desc>Kiln #D95B3F rounded-square seal · Graphite #252933 nib diamond · Vellum slit · Amber forge line. Pure path/shape, 0 font dependency.</desc>

  <defs>
    <radialGradient id="kilnGrad" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#E27654"/>
      <stop offset="65%" stop-color="#D95B3F"/>
      <stop offset="100%" stop-color="#B84A30"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4B070"/>
      <stop offset="100%" stop-color="#C19A56"/>
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Safe padding: viewBox 1024 with 22% padding → seal lives in 226..798 (572×572) -->
  <!-- Kiln seal background + hairline inner border (preserved from prior brand) -->
  <g filter="url(#sealShadow)">
    <rect x="226" y="226" width="572" height="572" rx="72" ry="72" fill="url(#kilnGrad)"/>
    <rect x="244" y="244" width="536" height="536" rx="58" ry="58" fill="none" stroke="#F5F0E6" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Forge Nib mark — pure geometry, 0 font dependency, replaces 「铸」 text -->
  <g>
    <!-- Graphite nib diamond (main mark, fills ~70% of seal interior) -->
    <polygon points="512,312 680,512 512,712 344,512" fill="#252933"/>
    <!-- Top-left bevel highlight (large-size decorative; harmless at 16px) -->
    <polyline points="380,500 512,360" fill="none" stroke="#F5F0E6" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
    <!-- Vellum nib slit — survives at 16px raster, anchors the silhouette -->
    <rect x="506" y="380" width="12" height="260" rx="6" ry="6" fill="#F5F0E6"/>
    <!-- Amber forge line below the seal (锻造火痕) -->
    <rect x="412" y="748" width="200" height="10" rx="5" ry="5" fill="url(#amberGrad)"/>
  </g>
</svg>
