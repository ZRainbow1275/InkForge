<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkForge — 内容创作工作站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════════════
           InkForge Hub — Ethereal Constructivism + Bento Grid
           统一设计语言：构成主义红 + 便当盒布局
        ═══════════════════════════════════════════════════════════════════ */

        :root {
            /* ═══ 材质 (Materiality) ═══ */
            --bg-rice-paper: #FAFBFC;
            --bg-surface: #FFFFFF;
            --bg-frosted: rgba(255, 255, 255, 0.85);
            --bg-elevated: rgba(255, 255, 255, 0.95);

            /* ═══ 构成主义色彩 (Constructivist Palette) ═══ */
            --accent-primary: #D32F2F;
            --accent-primary-light: #FFEBEE;
            --accent-primary-dark: #B71C1C;
            --accent-secondary: #1565C0;
            --accent-secondary-light: #E3F2FD;

            /* ═══ 中性色 (Neutral) ═══ */
            --text-primary: #263238;
            --text-secondary: #607D8B;
            --text-muted: #90A4AE;
            --border: #ECEFF1;
            --border-light: #F5F5F5;

            /* ═══ 语义色 (Semantic) ═══ */
            --success: #2E7D32;
            --warning: #F57C00;
            --error: #C62828;

            /* ═══ 留白节奏 (Space Rhythm - 8px Grid) ═══ */
            --space-micro: 4px;
            --space-small: 8px;
            --space-medium: 16px;
            --space-large: 32px;
            --space-macro: 64px;

            /* ═══ 动效 (Motion) ═══ */
            --ease-panel: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);

            /* ═══ 阴影层级 (Elevation) ═══ */
            --shadow-soft: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            background: var(--bg-rice-paper);
            color: var(--text-primary);
            padding: var(--space-large);
            /* Rice Paper 微纹理 */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E");
        }

        /* ═══ HEADER ═══ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto var(--space-large);
            padding: 0 var(--space-small);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: var(--accent-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.3);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-text span {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            background: var(--border-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-medium);
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-frosted);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .sync-dot {
            position: relative;
            width: 8px;
            height: 8px;
        }

        .sync-dot::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .sync-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--success);
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0; }
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--bg-frosted);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s var(--ease-smooth);
            color: var(--text-secondary);
        }

        .icon-btn:hover {
            background: var(--bg-surface);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid var(--bg-surface);
            box-shadow: var(--shadow-soft);
        }

        /* ═══ BENTO GRID ═══ */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            height: calc(100vh - 140px);
            max-width: 1400px;
            margin: 0 auto;
        }

        .bento-card {
            background: var(--bg-frosted);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: var(--space-large);
            transition: all 0.3s var(--ease-panel);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
            border-color: rgba(211, 47, 47, 0.2);
        }

        /* ═══ HERO CARD (Creation Flow) ═══ */
        .card-hero {
            grid-column: span 2;
            grid-row: span 2;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-primary-dark) 100%);
            border: none;
            color: white;
        }

        .card-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-hero .card-icon {
            position: absolute;
            top: 32px;
            right: 32px;
            opacity: 0.15;
        }

        .card-hero h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-hero .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: var(--space-large);
        }

        .chart-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            padding-top: var(--space-medium);
        }

        .chart-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px 6px 0 0;
            transition: all 0.3s var(--ease-bounce);
            cursor: pointer;
            position: relative;
        }

        .chart-bar:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .chart-bar.active {
            background: white;
            box-shadow: 0 -4px 20px rgba(255,255,255,0.4);
        }

        .chart-bar .tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: var(--text-primary);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.2s var(--ease-bounce);
            pointer-events: none;
        }

        .chart-bar:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-top: var(--space-medium);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        /* ═══ STATS CARD ═══ */
        .card-stats {
            grid-row: span 2;
            justify-content: center;
            gap: var(--space-large);
        }

        .stat-item {
            text-align: center;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-small);
        }

        .stat-icon.red { background: var(--accent-primary-light); color: var(--accent-primary); }
        .stat-icon.blue { background: var(--accent-secondary-light); color: var(--accent-secondary); }
        .stat-icon.green { background: #E8F5E9; color: var(--success); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .stat-divider {
            height: 1px;
            background: var(--border);
        }

        /* ═══ NEW PROJECT CARD ═══ */
        .card-new {
            border: 2px dashed var(--border);
            background: transparent;
            backdrop-filter: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s var(--ease-smooth);
        }

        .card-new:hover {
            border-color: var(--accent-primary);
            background: var(--accent-primary-light);
        }

        .card-new .new-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-surface);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-medium);
            box-shadow: var(--shadow-soft);
            transition: all 0.2s var(--ease-bounce);
            color: var(--text-muted);
        }

        .card-new:hover .new-icon {
            transform: scale(1.1) rotate(90deg);
            color: var(--accent-primary);
            box-shadow: var(--shadow-medium);
        }

        .card-new h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .card-new:hover h3 {
            color: var(--accent-primary);
        }

        .card-new p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ═══ CATEGORIES CARD ═══ */
        .card-categories {
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-medium);
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-header a {
            font-size: 12px;
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .card-header a:hover {
            text-decoration: underline;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-medium);
            flex: 1;
        }

        .category-item {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: var(--space-medium);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s var(--ease-smooth);
            border: 1px solid transparent;
        }

        .category-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .category-item.tech { background: #E3F2FD; }
        .category-item.tech:hover { border-color: #1565C0; }
        .category-item.life { background: #FFF3E0; }
        .category-item.life:hover { border-color: #F57C00; }
        .category-item.work { background: #E8F5E9; }
        .category-item.work:hover { border-color: #2E7D32; }

        .category-item i {
            margin-bottom: var(--space-small);
        }

        .category-item .name {
            font-size: 14px;
            font-weight: 700;
        }

        .category-item.tech .name { color: #1565C0; }
        .category-item.life .name { color: #E65100; }
        .category-item.work .name { color: #2E7D32; }

        .category-item .count {
            font-size: 11px;
            opacity: 0.7;
        }

        /* ═══ RECENT FILE CARD ═══ */
        .card-recent .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            margin-bottom: var(--space-small);
        }

        .card-recent h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-small);
            line-height: 1.3;
        }

        .card-recent .excerpt {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .card-recent .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: var(--space-medium);
        }

        .status-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: var(--border-light);
            color: var(--text-muted);
        }

        .status-tag.draft { background: #FFF8E1; color: #F57C00; }

        .open-btn {
            width: 36px;
            height: 36px;
            background: var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.2s var(--ease-bounce);
        }

        .open-btn:hover {
            transform: scale(1.1);
            background: var(--accent-primary);
        }

        /* ═══ INSPIRATION CARD ═══ */
        .card-inspiration {
            background: var(--text-primary);
            color: white;
            border: none;
        }

        .card-inspiration::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .card-inspiration .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .card-inspiration .spark-icon {
            color: #FFC107;
            margin-bottom: var(--space-small);
        }

        .card-inspiration h3 {
            font-size: 15px;
            font-weight: 700;
        }

        .card-inspiration .quote {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-style: italic;
            opacity: 0.8;
            line-height: 1.6;
        }

        /* ═══ ANIMATIONS ═══ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bento-card {
            animation: fadeInUp 0.5s var(--ease-panel) backwards;
        }

        .bento-card:nth-child(1) { animation-delay: 0.05s; }
        .bento-card:nth-child(2) { animation-delay: 0.1s; }
        .bento-card:nth-child(3) { animation-delay: 0.15s; }
        .bento-card:nth-child(4) { animation-delay: 0.2s; }
        .bento-card:nth-child(5) { animation-delay: 0.25s; }
        .bento-card:nth-child(6) { animation-delay: 0.3s; }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- ══════ HEADER ══════ -->
        <header class="header">
            <div class="header-brand">
                <div class="logo">IF</div>
                <div class="brand-text">
                    <h1>InkForge<span>v5.0</span></h1>
                    <p>欢迎回来，创作者</p>
                </div>
            </div>

            <div class="header-actions">
                <div class="sync-badge">
                    <div class="sync-dot"></div>
                    刚刚同步
                </div>
                <div class="icon-btn" @click="goToSettings" title="设置">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </div>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=InkForge" class="avatar" alt="Avatar">
            </div>
        </header>

        <!-- ══════ BENTO GRID ══════ -->
        <div class="bento-container">

            <!-- 1. HERO: Creation Flow -->
            <div class="bento-card card-hero">
                <i data-lucide="activity" class="w-48 h-48 card-icon"></i>
                <h2>创作流</h2>
                <p class="subtitle">本周产出速度位列前 5%</p>

                <div class="chart-container">
                    <div class="chart-bar" style="height: 40%;">
                        <span class="tooltip">3 篇</span>
                    </div>
                    <div class="chart-bar" style="height: 60%;">
                        <span class="tooltip">5 篇</span>
                    </div>
                    <div class="chart-bar" style="height: 30%;">
                        <span class="tooltip">2 篇</span>
                    </div>
                    <div class="chart-bar active" style="height: 80%;">
                        <span class="tooltip">12 篇</span>
                    </div>
                    <div class="chart-bar" style="height: 50%;">
                        <span class="tooltip">4 篇</span>
                    </div>
                    <div class="chart-bar" style="height: 70%;">
                        <span class="tooltip">8 篇</span>
                    </div>
                    <div class="chart-bar" style="height: 45%;">
                        <span class="tooltip">3 篇</span>
                    </div>
                </div>

                <div class="chart-labels">
                    <span>周一</span>
                    <span>周二</span>
                    <span>周三</span>
                    <span>周四</span>
                    <span>周五</span>
                    <span>周六</span>
                    <span>周日</span>
                </div>
            </div>

            <!-- 2. STATS -->
            <div class="bento-card card-stats">
                <div class="stat-item">
                    <div class="stat-icon red">
                        <i data-lucide="file-text" class="w-6 h-6"></i>
                    </div>
                    <div class="stat-value">24</div>
                    <div class="stat-label">文章总数</div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <div class="stat-icon blue">
                        <i data-lucide="eye" class="w-6 h-6"></i>
                    </div>
                    <div class="stat-value">8.5K</div>
                    <div class="stat-label">总阅读量</div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <div class="stat-icon green">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>
                    <div class="stat-value">98%</div>
                    <div class="stat-label">效率指数</div>
                </div>
            </div>

            <!-- 3. NEW PROJECT -->
            <div class="bento-card card-new" @click="startNewProject">
                <div class="new-icon">
                    <i data-lucide="plus" class="w-7 h-7"></i>
                </div>
                <h3>开始新项目</h3>
                <p>从模板或空白开始</p>
            </div>

            <!-- 4. CATEGORIES -->
            <div class="bento-card card-categories">
                <div class="card-header">
                    <h3>我的分类</h3>
                    <a href="#">管理</a>
                </div>
                <div class="category-grid">
                    <div class="category-item tech" @click="openCategory('tech')">
                        <i data-lucide="cpu" class="w-6 h-6" style="color: #1565C0;"></i>
                        <div>
                            <div class="name">科技</div>
