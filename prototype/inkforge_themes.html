<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkForge — 主题预设</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-rice-paper: #FAFBFC;
            --bg-surface: #FFFFFF;
            --bg-frosted: rgba(255, 255, 255, 0.9);
            --accent-primary: #D32F2F;
            --accent-primary-light: #FFEBEE;
            --text-primary: #263238;
            --text-secondary: #607D8B;
            --text-muted: #90A4AE;
            --border: #ECEFF1;
            --border-light: #F5F5F5;
            --ease-panel: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-soft: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            background: var(--bg-rice-paper);
            color: var(--text-primary);
            padding: 32px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E");
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ═══ HEADER ═══ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .back-btn:hover {
            background: var(--accent-primary-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .current-theme {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .current-theme .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* ═══ THEME GRID ═══ */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .theme-card {
            background: var(--bg-surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s var(--ease-smooth);
        }

        .theme-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
        }

        .theme-card.active {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-light);
        }

        .theme-preview {
            height: 160px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .theme-preview h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .theme-preview p {
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            line-height: 1.7;
            opacity: 0.8;
        }

        .theme-info {
            padding: 16px 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-meta .theme-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-meta .theme-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .theme-color {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: var(--shadow-soft);
        }

        .theme-tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .tag {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tag.font {
            background: #E3F2FD;
            color: #1565C0;
        }

        .tag.style {
            background: #F3E5F5;
            color: #7B1FA2;
        }

        .tag.layout {
            background: #E8F5E9;
            color: #2E7D32;
        }

        /* ═══ APPLY BUTTON ═══ */
        .apply-btn {
            display: none;
            padding: 8px 16px;
            background: var(--accent-primary);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }

        .theme-card:hover .apply-btn,
        .theme-card.active .apply-btn {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .apply-btn:hover {
            background: #B71C1C;
        }

        /* ═══ ANIMATIONS ═══ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-card {
            animation: fadeInUp 0.4s var(--ease-panel) backwards;
        }

        .theme-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .theme-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .theme-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .theme-card:nth-child(4) {
            animation-delay: 0.2s;
        }

        .theme-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .theme-card:nth-child(6) {
            animation-delay: 0.3s;
        }

        .theme-card:nth-child(7) {
            animation-delay: 0.35s;
        }

        .theme-card:nth-child(8) {
            animation-delay: 0.4s;
        }

        .theme-card:nth-child(9) {
            animation-delay: 0.45s;
        }

        .theme-card:nth-child(10) {
            animation-delay: 0.5s;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <header class="page-header">
                <div class="header-left">
                    <div class="back-btn" @click="goBack">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="page-title">主题预设</h1>
                        <p class="page-subtitle">选择适合您内容的排版风格</p>
                    </div>
                </div>
                <div class="current-theme">
                    <div class="dot" :style="{ background: themes.find(t => t.id === selected)?.color }"></div>
                    当前：{{ themes.find(t => t.id === selected)?.name }}
                </div>
            </header>

            <div class="theme-grid">
                <div v-for="theme in themes" :key="theme.id" class="theme-card"
                    :class="{ active: selected === theme.id }" @click="selectTheme(theme.id)">
                    <div class="theme-preview" :style="theme.previewStyle">
                        <h3 :style="{ color: theme.color }">{{ theme.sampleTitle }}</h3>
                        <p :style="{ textIndent: theme.indent ? '2em' : '0' }">{{ theme.sampleText }}</p>
                    </div>
                    <div class="theme-info">
                        <div class="theme-meta">
                            <div class="theme-name">
                                <span>{{ theme.icon }}</span>
                                {{ theme.name }}
                            </div>
                            <div class="theme-desc">{{ theme.desc }}</div>
                            <div class="theme-tags">
                                <span class="tag font">{{ theme.fontType }}</span>
                                <span class="tag style" v-if="theme.style">{{ theme.style }}</span>
                            </div>
                        </div>
                        <div class="apply-btn" @click.stop="applyTheme(theme.id)">
                            <i data-lucide="check" class="w-3 h-3"></i>
                            应用
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue

        createApp({
            setup() {
                const selected = ref('thesis')

                const themes = ref([
                    {

                        desc: '学术严谨，苏联红色调',

                    },
                    {

                        indent: true,
                        sampleTitle: '论数字时代的知识产权保护边界',
                        sampleText: '随着人工智能生成内容的普及，著作权法面临重新定义创作主体的挑战...',
                        previewStyle: { background: '#F8FAFC' }
                    },
                    {
                        id: 'report',

                        icon: '📊',
                        desc: '商务专业，商务蓝',
                        color: '#004080',
                        fontType: 'Sans',
                        style: '无衬线',
                        indent: false,
                        sampleTitle: '2024 年新能源汽车市场深度分析',
                        sampleText: '受政策支持与技术突破双重驱动，新能源渗透率持续攀升...',
                        previewStyle: { background: '#F5F8FA' }
                    },
                    {
                        id: 'news',
                        name: '时事点评',
                        icon: '📰',
                        desc: '新闻风格，正红色调',
                        color: '#D32F2F',
                        fontType: 'Sans',
                        indent: false,
                        sampleTitle: '深度解读：全球科技竞争新格局',
                        sampleText: '面对日益复杂的国际形势，科技自主创新成为战略必答题...',
                        previewStyle: { background: '#FFFFFF' }
                    },
                    {

                    {

                    {

                    {

                    {

                    },
                    {
                        id: 'zen',
                        name: '人生感悟',
                        icon: '🌿',
                        desc: '淡雅宁静，灰绿色调',

                        previewStyle: { background: '#F9FAF8' }
                    }
                ])

                function selectTheme(id) {
                    selected.value = id
                }

                function applyTheme(id) {
                    selected.value = id
                    window.location.href = 'inkforge_workstation.html?theme=' + id
                }

                function goBack() {
                    window.location.href = 'inkforge_workstation.html'
                }

                return {
                    selected,
                    themes,
                    selectTheme,
                    applyTheme,
                    goBack
                }
            },
            mounted() {
                lucide.createIcons()
            }
        }).mount('#app')
    </script>
</body>

</html>
