<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="InkForge 墨铸 — 墨滴 · 笔锋 · 铁砧 mark (64-tier)">
  <title>InkForge 墨铸 — 墨滴 · 笔锋 · 铁砧 (64/96 raster)</title>
  <desc>Tier 3 — mirrors src/components/chrome/ForgeNibMark.vue tier 64 verbatim: a full sliced ink-drop with a 1px-equivalent top-left highlight, a full nib-arrow (shaft + full arrowhead), a Forged-Red ember, and a forging-anvil base with overhang — the canonical 墨滴·笔锋·铁砧 logo with the nib-arrow restored. Palette: Ink Black #1C1F23, Forged Red #C9362C, highlight grey #3A3E45, Paper #F7F4EF (slice gap). Transparent background. 0 font dependency.</desc>

  <defs>
    <mask id="dropSlice">
