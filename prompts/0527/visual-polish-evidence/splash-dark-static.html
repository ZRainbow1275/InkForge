<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InkForge Splash · Dark Mode Preview</title>
  <style>
    body { margin: 0; background: #2c2c2c; min-height: 100vh; display: grid; place-items: center; font-family: sans-serif; color: #ddd; padding: 24px; gap: 16px; }
    .frame { width: 520px; height: 340px; box-shadow: 0 18px 48px rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; background: #1A1D24; }
    .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .meta { font-size: 13px; max-width: 520px; line-height: 1.5; opacity: 0.85; }
    .meta a { color: #C19A56; }
    .meta code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="meta">
    <strong>InkForge Splash Preview — Dark Mode</strong><br>
    Canonical source: <code>inkforge/public/splash.html</code> (this preview iframes that file and forces <code>data-theme="dark"</code>).<br>
    Light variant: <a href="./splash-light-static.html">splash-light-static.html</a>.
  </div>
  <div class="frame">
    <iframe src="../../../inkforge/public/splash.html" title="InkForge splash (dark)"></iframe>
  </div>
  <script>
    const iframe = document.querySelector('iframe');
    iframe.addEventListener('load', () => {
      try {
        iframe.contentDocument.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        // file:// cross-origin restriction; OS prefers-color-scheme will apply.
      }
    });
  </script>
</body>
</html>
