<section style="background-color: #f7f7f7; padding: 20px 0; border-radius: 12px; box-sizing: border-box;">
    <!-- 标题（可选） -->
    <h3 style="text-align: center; margin: 0 0 20px 0; font-size: 18px; color: #333;">重磅嘉宾阵容</h3>

    <div style="overflow: auto; white-space: nowrap; padding: 10px 20px;">
        <!-- 嘉宾卡片 1 -->
        <div style="display: inline-block; width: 290px; margin-right: 15px; vertical-align: top; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; text-align: left;">
            <img src="https://via.placeholder.com/290x220.png?text=嘉宾头像/照片" style="display: block; width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #eee;">
            <div style="padding: 15px; white-space: normal;">
                <p style="font-size: 17px; color: #333; margin: 0 0 8px 0; font-weight: bold;">嘉宾姓名 (或昵称)</p>
                <p style="font-size: 14px; color: #555; margin: 0; line-height: 1.7;">
                    这里可以放入大段的嘉宾介绍文字。例如，嘉宾的个人履历、行业背景、主要成就，以及本次将要分享的主题等。这段文字会自动换行，卡片高度也会随之自适应，无需担心内容溢出。您可以根据需要尽情填写。
                </p>
            </div>
        </div>

        <!-- 嘉宾卡片 2 -->
        <div style="display: inline-block; width: 290px; margin-right: 15px; vertical-align: top; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; text-align: left;">
            <img src="https://via.placeholder.com/290x220.png?text=嘉宾头像/照片" style="display: block; width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #eee;">
            <div style="padding: 15px; white-space: normal;">
                <p style="font-size: 17px; color: #333; margin: 0 0 8px 0; font-weight: bold;">另一位嘉宾</p>
                <p style="font-size: 14px; color: #555; margin: 0; line-height: 1.7;">
                    同样，这里可以填写第二位嘉宾的详细介绍。即使文字比第一位嘉宾多或者少，卡片的显示效果也依然很棒，它们会保持顶部对齐。
                </p>
            </div>
        </div>

        <!-- 嘉宾卡片 3 (可以继续添加) -->
        <div style="display: inline-block; width: 290px; vertical-align: top; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; text-align: left;">
            <img src="https://via.placeholder.com/290x220.png?text=嘉宾头像/照片" style="display: block; width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #eee;">
            <div style="padding: 15px; white-space: normal;">
                <p style="font-size: 17px; color: #333; margin: 0 0 8px 0; font-weight: bold;">嘉宾三</p>
                <p style="font-size: 14px; color: #555; margin: 0; line-height: 1.7;">
                    向左滑动，发现更多精彩嘉宾。
                </p>
            </div>
        </div>
    </div>
</section>
