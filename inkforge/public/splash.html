<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InkForge · 墨铸</title>
  <style>
    /* ------------------------------------------------------------------
       InkForge splash — Brand identity §10
       Vellum #F5F0E6 background with subtle 仿宣纸 noise.
       Seal animation: drop (0→300ms) → squish (300→360ms) → bleed (360→800ms).
       data-theme="dark" on :root takes precedence over prefers-color-scheme.
       prefers-reduced-motion disables all animations; static identity remains.
    ------------------------------------------------------------------ */

    :root {
      /* Motion tokens mirrored from src/styles/tokens.css. Splash loads
         before Vue so it cannot import from there; values are kept in sync
         manually (Restrained Premium ladder, §13 of brand identity doc). */
      --motion-base: 180ms;
      --motion-slow: 240ms;
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);

      --ink-vellum: #F5F0E6;
      --ink-char: #1A1D24;
      --ink-graphite: #252933;
      --ink-text-dark: #E8E4DC;
      --ink-ash: #6E7580;
      --ink-smoke: #9B958D;
      --ink-kiln: #D95B3F;
      --ink-kiln-dark: #E8734F;
      --ink-amber: #C19A56;
      --ink-bg: var(--ink-vellum);
      --ink-text: var(--ink-graphite);
      --ink-muted: var(--ink-ash);
      --ink-seal: var(--ink-kiln);
    }

    /* prefers-color-scheme dark — only if no explicit data-theme set */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink-bg: var(--ink-char);
        --ink-text: var(--ink-text-dark);
        --ink-muted: var(--ink-smoke);
        --ink-seal: var(--ink-kiln-dark);
      }
    }
    /* Explicit data-theme from Rust setup hook wins */
    :root[data-theme="dark"] {
      --ink-bg: var(--ink-char);
      --ink-text: var(--ink-text-dark);
      --ink-muted: var(--ink-smoke);
      --ink-seal: var(--ink-kiln-dark);
    }
    :root[data-theme="light"] {
      --ink-bg: var(--ink-vellum);
      --ink-text: var(--ink-graphite);
      --ink-muted: var(--ink-ash);
      --ink-seal: var(--ink-kiln);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      color: var(--ink-text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    .ink-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--ink-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 仿宣纸纹理 — 极淡的多层径向渐变模拟纤维 */
    .ink-canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(193, 154, 86, 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(59, 122, 107, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 41, 51, 0.02) 0%, transparent 70%);
      opacity: 0.9;
    }
    :root[data-theme="dark"] .ink-canvas::before,
    :root:not([data-theme="light"]) .ink-canvas::before {
      opacity: 0.5;
    }

    /* 印章本体 — 复用 master.svg 的几何，去除外侧 22% padding */
    .ink-seal {
      position: relative;
      width: 108px;
      height: 108px;
      flex-shrink: 0;
      animation: ink-seal-drop 360ms var(--ease-out-quart) both;
      transform-origin: 50% 100%;
    }
    .ink-seal svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 14px rgba(37, 41, 51, 0.18));
    }
    :root[data-theme="dark"] .ink-seal svg,
    :root:not([data-theme="light"]) .ink-seal svg {
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
    }

    /* 8-direction ink bleed — emanating from seal edges */
    .ink-bleed {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 108px;
      height: 108px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      animation: ink-bleed-fade 440ms cubic-bezier(0.4, 0, 0.6, 1) 360ms both;
    }
    .ink-bleed span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--ink-seal) 0%, rgba(217, 91, 63, 0) 70%);
      opacity: 0.35;
      transform-origin: 0 0;
    }
    /* 8 方向 — N / NE / E / SE / S / SW / W / NW */
    .ink-bleed span:nth-child(1) { transform: translate(-50%, -110px); }
    .ink-bleed span:nth-child(2) { transform: translate(60px, -78px); }
    .ink-bleed span:nth-child(3) { transform: translate(78px, -50%); }
    .ink-bleed span:nth-child(4) { transform: translate(60px, 42px); }
    .ink-bleed span:nth-child(5) { transform: translate(-50%, 74px); }
    .ink-bleed span:nth-child(6) { transform: translate(-78px, 42px); }
    .ink-bleed span:nth-child(7) { transform: translate(-96px, -50%); }
    .ink-bleed span:nth-child(8) { transform: translate(-78px, -78px); }

    .ink-wordmark {
      margin-top: 28px;
      text-align: center;
      animation: ink-wordmark-rise 500ms var(--ease-out-quart) 240ms both;
    }
    .ink-wordmark__latin {
      font-family: "EB Garamond", "Crimson Pro", Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-text);
    }
    .ink-wordmark__separator {
      display: inline-block;
      margin: 0 0.5em;
      color: var(--ink-seal);
      font-weight: 400;
      opacity: 0.78;
    }
    .ink-wordmark__cjk {
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ink-text);
    }
    .ink-tagline {
      margin-top: 12px;
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", serif;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.25em;
      color: var(--ink-muted);
      animation: ink-tagline-fade 400ms cubic-bezier(0.4, 0, 0.6, 1) 480ms both;
    }

    /* ----- Animations ------------------------------------------------ */

    @keyframes ink-seal-drop {
      0% {
        opacity: 0;
        transform: translateY(-40px) scale(0.92);
      }
      80% {
        opacity: 1;
        transform: translateY(2px) scaleY(0.92) scaleX(1.04);
      }
      90% {
        transform: translateY(0) scaleY(1.02) scaleX(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ink-bleed-fade {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes ink-wordmark-rise {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes ink-tagline-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ----- Reduced motion ------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .ink-seal,
      .ink-bleed,
      .ink-wordmark,
      .ink-tagline {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .ink-bleed { display: none; }
    }
  </style>
</head>
<body>
  <div class="ink-canvas">
    <div class="ink-bleed" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="ink-seal" role="img" aria-label="InkForge 墨铸 印章">
      <!--
        Reused from inkforge/src-tauri/icons/master.svg (Forge Nib geometry).
        We trim the 22% safe padding (originally for Win11 squircle / macOS
        rounded square auto-crop) by mapping the viewBox to the seal body
        226..798 → 0..572. Filter omitted for splash render performance;
        an outer drop-shadow is applied via CSS on .ink-seal svg.
      -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="226 226 572 572">
        <defs>
          <radialGradient id="splashKiln" cx="50%" cy="44%" r="62%">
            <stop offset="0%" stop-color="#E27654" />
            <stop offset="65%" stop-color="#D95B3F" />
            <stop offset="100%" stop-color="#B84A30" />
          </radialGradient>
          <linearGradient id="splashAmber" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#D4B070" />
            <stop offset="100%" stop-color="#C19A56" />
          </linearGradient>
        </defs>
        <!-- Seal body (Kiln rounded square) -->
        <rect x="226" y="226" width="572" height="572" rx="72" ry="72" fill="url(#splashKiln)" />
        <!-- Inner stamped border -->
        <rect x="244" y="244" width="536" height="536" rx="58" ry="58" fill="none" stroke="#F5F0E6" stroke-opacity="0.18" stroke-width="2" />
        <!-- Forge Nib: Graphite diamond -->
        <polygon points="512,312 680,512 512,712 344,512" fill="#252933" />
        <!-- Bevel highlight on the upper-left edge -->
        <polyline points="380,500 512,360" fill="none" stroke="#F5F0E6" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round" />
        <!-- Vellum nib slit -->
        <rect x="506" y="380" width="12" height="260" rx="6" ry="6" fill="#F5F0E6" />
        <!-- Amber forge line below seal -->
        <rect x="412" y="748" width="200" height="10" rx="5" ry="5" fill="url(#splashAmber)" />
      </svg>
    </div>

    <div class="ink-wordmark">
      <span class="ink-wordmark__latin">InkForge</span>
      <span class="ink-wordmark__separator">·</span>
      <span class="ink-wordmark__cjk">墨铸</span>
    </div>
    <div class="ink-tagline">成为作者吧</div>
  </div>
</body>
</html>
